name: Deploy to Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: true
        default: production
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta

concurrency:
  group: deploy-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # cache-provider は MIT の basic を使う : デフォルトの enhanced はプロプライエタリな
      # gradle-actions-caching を読み込み Gradle の ToU 同意が必要になる
      # https://github.com/gradle/actions/blob/v6.3.0/DISTRIBUTION.md
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - uses: ./.github/actions/build-tun2socks-aar

      - name: Run unit tests
        run: ./gradlew testPlayDebugUnitTest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: play-store

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # cache-provider は MIT の basic を使う : デフォルトの enhanced はプロプライエタリな
      # gradle-actions-caching を読み込み Gradle の ToU 同意が必要になる
      # https://github.com/gradle/actions/blob/v6.3.0/DISTRIBUTION.md
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - uses: ./.github/actions/build-tun2socks-aar

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      # versionCode は実行番号を使う。main に bump を push すると App の鍵とルールセットの bypass が要るため
      # Re-run は実行番号が変わらず Play に同じ versionCode を弾かれるので、新しく実行し直す
      - name: Build release AAB
        run: |
          ./gradlew bundlePlayRelease -PplayVersionCode=${{ github.run_number }}
          echo "versionCode: ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: okoge.house.throttling_app.play
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ inputs.track }}
          whatsNewDirectory: distribution/whatsnew
